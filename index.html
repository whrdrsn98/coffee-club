<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211b18">
  <title>Coffee Club</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2ec; --card: #fffdf9; --ink: #28211d;
      --muted: #81766e; --accent: #6c4935; --accent-soft: #eee3d8;
      --line: #e9e0d7; --green: #426b4c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 0 0 calc(82px + env(safe-area-inset-bottom));
    }
    .app { max-width: 560px; margin: 0 auto; padding: 22px 18px 28px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
    .brand { font-size:21px; font-weight:800; letter-spacing:-.7px; }
    .brand span { color:var(--accent); }
    .tag { font-size:11px; color:var(--muted); background:#ebe4dc; padding:7px 10px; border-radius:20px; }
    .hero {
      background: linear-gradient(135deg,#38271f,#75533d); color:white;
      border-radius:22px; padding:22px; position:relative; overflow:hidden;
      box-shadow:0 12px 30px rgba(61,42,30,.13);
    }
    .hero:after { content:"☕"; position:absolute; right:15px; bottom:-22px; font-size:104px; opacity:.13; transform:rotate(-13deg); }
    .eyebrow { font-size:11px; letter-spacing:1.3px; opacity:.75; text-transform:uppercase; }
    .balance { font-size:36px; font-weight:800; margin:8px 0 5px; letter-spacing:-1.2px; }
    .hero-note { font-size:13px; opacity:.78; }
    .section-head { display:flex; justify-content:space-between; align-items:end; margin:27px 0 14px; }
    h2 { font-size:20px; margin:0; letter-spacing:-.5px; }
    .section-sub { font-size:12px; color:var(--muted); }
    .filters { display:flex; gap:8px; overflow-x:auto; padding-bottom:5px; scrollbar-width:none; }
    .filters::-webkit-scrollbar { display:none; }
    .filter {
      border:1px solid var(--line); background:var(--card); color:var(--muted);
      border-radius:22px; padding:9px 14px; white-space:nowrap; font-size:13px;
    }
    .filter.active { background:var(--accent); border-color:var(--accent); color:white; }
    .menu-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px; }
    .drink { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
    .drink-art {
      height:116px; display:grid; place-items:center; font-size:53px;
      background:linear-gradient(145deg,#eee3d8,#d9c4ae);
    }
    .drink:nth-child(3n+2) .drink-art { background:linear-gradient(145deg,#e8e5dc,#c8c5b5); }
    .drink:nth-child(3n) .drink-art { background:linear-gradient(145deg,#ead9c9,#caa88d); }
    .drink-info { padding:12px; }
    .drink-name { font-size:14px; font-weight:750; }
    .drink-desc { color:var(--muted); font-size:11px; line-height:1.4; min-height:30px; margin-top:5px; }
    .drink-bottom { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
    .price { font-weight:800; font-size:14px; }
    .add {
      border:0; background:var(--accent-soft); color:var(--accent);
      border-radius:50%; width:30px; height:30px; font-size:20px; line-height:1;
    }
    .empty { grid-column:1/-1; color:var(--muted); text-align:center; padding:28px 10px; }
    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; z-index:5;
      background:rgba(255,253,249,.96); border-top:1px solid var(--line);
      display:flex; justify-content:center; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      backdrop-filter:blur(12px);
    }
    .nav-inner { max-width:560px; width:100%; display:flex; justify-content:space-around; }
    .nav-item { border:0; background:none; color:var(--muted); font-size:11px; display:grid; gap:4px; justify-items:center; }
    .nav-item strong { font-size:19px; font-weight:500; }
    .nav-item.active { color:var(--accent); font-weight:750; }
    .toast {
      position:fixed; left:50%; bottom:92px; transform:translateX(-50%);
      background:#28211d; color:white; padding:11px 16px; border-radius:24px;
      font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s;
      white-space:nowrap; z-index:10;
    }
    .toast.show { opacity:1; }
    @media (max-width:360px) { .app{padding-left:14px;padding-right:14px}.menu-grid{gap:9px}.drink-art{height:100px} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">COFFEE <span>CLUB</span></div>
      <div class="tag">YOUR DAILY COFFEE</div>
    </header>

    <section class="hero" aria-label="Бонусный баланс">
      <div class="eyebrow">Ваш бонусный баланс</div>
      <div class="balance"><span id="balance">245</span> <span style="font-size:18px;font-weight:600">бонусов</span></div>
      <div class="hero-note">Начисляем 7% бонусами с каждой покупки</div>
    </section>

    <div class="section-head">
      <h2>Меню</h2>
      <div class="section-sub">Выберите любимый напиток</div>
    </div>

    <nav class="filters" id="filters" aria-label="Категории меню"></nav>
    <section class="menu-grid" id="menu" aria-live="polite"></section>
  </main>

  <nav class="bottom-nav">
    <div class="nav-inner">
      <button class="nav-item active" type="button" data-tab="menu"><strong>▦</strong>Меню</button>
      <button class="nav-item" type="button" data-tab="bonus"><strong>✧</strong>Бонусы</button>
      <button class="nav-item" type="button" data-tab="about"><strong>ⓘ</strong>О кофейне</button>
    </div>
  </nav>
  <div class="toast" id="toast">Это демонстрационная версия</div>

  <script>
    // Демонстрационные данные. Позже заменим их данными из iiko или базы данных.
    const bonusBalance = 245;
    const categories = ["Все", "Кофе", "Холодные", "Чай"];
    const drinks = [
      { name:"Капучино", category:"Кофе", size:"250 мл", price:190, emoji:"☕", desc:"Эспрессо, молоко и нежная пенка" },
      { name:"Латте", category:"Кофе", size:"300 мл", price:210, emoji:"🥛", desc:"Мягкий кофейный вкус с молоком" },
      { name:"Флэт уайт", category:"Кофе", size:"200 мл", price:210, emoji:"☕", desc:"Насыщенный кофе и бархатистое молоко" },
      { name:"Айс-латте", category:"Холодные", size:"300 мл", price:220, emoji:"🧋", desc:"Охлаждённый кофе с молоком и льдом" },
      { name:"Эспрессо-тоник", category:"Холодные", size:"300 мл", price:240, emoji:"🍹", desc:"Эспрессо, тоник и лёд" },
      { name:"Матча-латте", category:"Чай", size:"300 мл", price:260, emoji:"🍵", desc:"Японская матча и молоко" }
    ];

    document.getElementById("balance").textContent = bonusBalance;
    const filtersEl = document.getElementById("filters");
    const menuEl = document.getElementById("menu");
    let activeCategory = "Все";

    function renderFilters() {
      filtersEl.innerHTML = categories.map(category =>
        `<button class="filter ${category === activeCategory ? "active" : ""}" data-category="${category}">${category}</button>`
      ).join("");
      filtersEl.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          renderFilters();
          renderMenu();
        });
      });
    }

    function renderMenu() {
      const visible = activeCategory === "Все"
        ? drinks
        : drinks.filter(drink => drink.category === activeCategory);

      menuEl.innerHTML = visible.length ? visible.map(drink => `
        <article class="drink">
          <div class="drink-art" aria-hidden="true">${drink.emoji}</div>
          <div class="drink-info">
            <div class="drink-name">${drink.name}</div>
            <div class="drink-desc">${drink.desc} · ${drink.size}</div>
            <div class="drink-bottom">
              <div class="price">${drink.price} ₽</div>
              <button class="add" type="button" aria-label="Выбрать ${drink.name}">+</button>
            </div>
          </div>
        </article>
      `).join("") : '<div class="empty">В этой категории пока нет напитков</div>';

      menuEl.querySelectorAll(".add").forEach(button => {
        button.addEventListener("click", showDemoToast);
      });
    }

    let toastTimer;
    function showDemoToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    document.querySelectorAll(".nav-item").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        if (button.dataset.tab !== "menu") showDemoToast();
        else window.scrollTo({top:0, behavior:"smooth"});
      });
    });

    renderFilters();
    renderMenu();

    // Если приложение открыто внутри Telegram, сообщаем Telegram, что интерфейс готов.
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
    }
  </script>
</body>
</html>
